<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <!-- Was declared image/svg+xml while pointing at a .jpg. -->
  <link rel="icon" type="image/jpeg" href="/curly.jpg" />

  <!-- Essential Mobile Responsiveness -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />

  <!--
    Every URL in this head used to point at https://huggingface.co/spaces/MEGH06/portfolio,
    which now answers 401. The canonical was the damaging one: it told search
    engines the real address of this page was somewhere else, which is a
    request to drop this site from the index in favour of a page nobody can
    open. The og:image 401'd too, so every link shared to a client — WhatsApp,
    LinkedIn, Slack, email — previewed as a blank card.
  -->
  <title>Megh Dave — AI/ML &amp; Full Stack Engineer, Mumbai</title>
  <!-- 132 characters. Google truncates the snippet around 155-160, and a
       description cut mid-sentence in the result reads as a site nobody
       checked. The og: copy below can run longer; social cards do not clip
       as hard. -->
  <meta name="description"
    content="AI/ML and full-stack engineer in Mumbai. I build machine-learning systems, RAG pipelines and agentic AI. Available for freelance work." />
  <meta name="author" content="Megh Dave" />
  <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />
  <link rel="canonical" href="https://megh4tech.vercel.app/" />

  <!-- Open Graph. This is what a client sees when the link is pasted into a
       chat, and for freelance work it is the single most-seen surface on the
       site — more people see the card than open the page. -->
  <meta property="og:type" content="profile" />
  <meta property="og:site_name" content="Megh Dave" />
  <meta property="og:locale" content="en_IN" />
  <meta property="og:url" content="https://megh4tech.vercel.app/" />
  <meta property="og:title" content="Megh Dave — AI/ML &amp; Full Stack Engineer, Mumbai" />
  <meta property="og:description"
    content="I build machine-learning systems, RAG pipelines, agentic AI and the backends around them. Available for freelance work." />
  <meta property="og:image" content="https://megh4tech.vercel.app/og.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Megh Dave — AI/ML and full stack engineer, Mumbai" />
  <meta property="profile:first_name" content="Megh" />
  <meta property="profile:last_name" content="Dave" />

  <!-- Twitter/X reads name=, not property=. The old tags used property= for
       all four, which is why they were ignored. -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Megh Dave — AI/ML &amp; Full Stack Engineer, Mumbai" />
  <meta name="twitter:description"
    content="I build machine-learning systems, RAG pipelines, agentic AI and the backends around them. Available for freelance work." />
  <meta name="twitter:image" content="https://megh4tech.vercel.app/og.png" />
  <meta name="twitter:image:alt" content="Megh Dave — AI/ML and full stack engineer, Mumbai" />

  <!-- Theme Color for Mobile Browsers -->
  <meta name="theme-color" content="#050505" />
  <meta name="msapplication-TileColor" content="#050505" />

  <!-- The page renders near-black long before React mounts; without this the
       browser paints a white flash first. -->
  <style>
    html, body { background: #050505; }
  </style>

  <!-- Standalone web-app hints. The apple-prefixed form alone is deprecated
       and Chrome warns about it; the standard name has to be present too. -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <!-- Preconnect for Performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!--
    Structured data. Two graphs rather than one Person: the page IS the
    profile, so ProfilePage/mainEntity is the shape Google documents for a
    person's own site, and it is what lets the knowledge panel and sitelinks
    attach to the right entity.

    Generated from src/data at build time — see the seo plugin in
    vite.config.js — so it cannot drift from what the page actually says.
  -->
  <!--seo:jsonld-->
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>

  <!--
    A real text version of the site for anything that does not run JavaScript.

    This used to say "please enable JavaScript", which is a dead end for a
    visitor and 190 characters of nothing for a crawler that does not render —
    and several of the crawlers that matter here do not, including some that
    build the previews and answers a client sees before they ever load the
    page. noscript is the correct place for it: it is never shown to a visitor
    who has JavaScript, so it cannot be a flash of unstyled content, and it is
    the same content the app renders, so it is not a separate page written for
    machines.

    Generated from src/data at build time.
  -->
  <noscript>
    <!--seo:noscript-->
  </noscript>
</body>

</html>
